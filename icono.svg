<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- Fondo: degradado vivo rosado → violeta profundo, con un brillo radial arriba -->
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5f8f"/>
      <stop offset=".45" stop-color="#d93b7f"/>
      <stop offset="1" stop-color="#4b1a8c"/>
    </linearGradient>
    <radialGradient id="luzFondo" cx=".28" cy=".18" r=".7">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <!-- Control de vidrio oscuro -->
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b2d3a"/>
      <stop offset="1" stop-color="#090a10"/>
    </linearGradient>
    <linearGradient id="filo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".35" stop-color="#fff" stop-opacity=".12"/>
      <stop offset=".7" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="reflejo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <!-- Anillo de navegación que brilla con el color de la marca -->
    <linearGradient id="anillo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd1e2"/>
      <stop offset=".5" stop-color="#ff5f8f"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="ok" cx=".4" cy=".35" r=".75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9e6f5"/>
    </radialGradient>
    <filter id="sombra" x="-40%" y="-20%" width="180%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="28"/>
      <feOffset dy="34"/>
      <feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="brillo" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#fondo)"/>
  <rect width="1024" height="1024" fill="url(#luzFondo)"/>

  <!-- Control remoto inclinado, de vidrio oscuro -->
  <g transform="translate(0 -18) rotate(-12 512 600)">
    <!-- Ondas de señal (inalámbrico), alineadas con el control -->
    <g fill="none" stroke="#fff" stroke-linecap="round">
      <path d="M402 168 Q512 100 622 168" stroke-width="30" stroke-opacity=".5"/>
      <path d="M448 216 Q512 178 576 216" stroke-width="30" stroke-opacity=".95"/>
    </g>
  </g>
  <g transform="translate(0 -18) rotate(-12 512 600)" filter="url(#sombra)">
    <rect x="352" y="262" width="320" height="660" rx="160" fill="url(#cuerpo)"/>
    <rect x="352" y="262" width="320" height="660" rx="160" fill="none" stroke="url(#filo)" stroke-width="8"/>
    <rect x="396" y="290" width="70" height="600" rx="35" fill="url(#reflejo)"/>

    <!-- Halo del anillo -->
    <circle cx="512" cy="452" r="128" fill="none" stroke="#ff5f8f" stroke-width="40" opacity=".6" filter="url(#brillo)"/>
    <!-- Anillo de navegación -->
    <circle cx="512" cy="452" r="112" fill="none" stroke="url(#anillo)" stroke-width="30"/>
    <!-- Botón OK -->
    <circle cx="512" cy="452" r="62" fill="url(#ok)"/>
    <ellipse cx="496" cy="430" rx="34" ry="18" fill="#fff" opacity=".9"/>

    <!-- Botones -->
    <rect x="442" y="636" width="140" height="44" rx="22" fill="#fff" opacity=".92"/>
    <rect x="442" y="714" width="140" height="44" rx="22" fill="#fff" opacity=".38"/>
    <circle cx="470" cy="818" r="22" fill="#fff" opacity=".28"/>
    <circle cx="554" cy="818" r="22" fill="#fff" opacity=".28"/>
  </g>
</svg>
