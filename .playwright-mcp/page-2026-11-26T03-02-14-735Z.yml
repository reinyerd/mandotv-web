  - region [ref=f2e367]:
    - heading "Todo lo del control, y más" [level=2] [ref=f2e368]
    - paragraph [ref=f2e369]: "Lo que haces con el control de siempre, más lo que con él cuesta: escribir, abrir apps, cambiar de entrada sin buscar botones y moverte rápido por los menús. Lo marcado con Pro es de pago único."
    - generic [ref=f2e370]:
      - list [ref=f2e371]:
        - listitem [ref=f2e372]:
          - generic [ref=f2e373]: Botones grandes y claros
          - generic [ref=f2e374]: Cruceta, OK, Atrás, Inicio, volumen, canales y silencio, con su nombre siempre visible.
        - listitem [ref=f2e375]:
          - generic [ref=f2e376]: Touchpad (Pro)
          - generic [ref=f2e377]: Desliza el dedo para moverte por los menús, o usa el puntero en los televisores que lo tienen.
        - listitem [ref=f2e378]:
          - generic [ref=f2e379]: Teclado del teléfono
          - generic [ref=f2e380]: Escribe una contraseña del WiFi o busca en apps sin pasar letra por letra. En YouTube, la búsqueda aparece directo en el TV.
        - listitem [ref=f2e381]:
          - generic [ref=f2e382]: Abre tus apps
          - generic [ref=f2e383]: Netflix, YouTube y las demás apps del televisor, con un toque.
        - listitem [ref=f2e384]:
          - generic [ref=f2e385]: Entradas y sonido
          - generic [ref=f2e386]: Cambia a HDMI, TV en vivo o la consola. Con Pro, en LG eliges si suena el TV o la barra de sonido.
        - listitem [ref=f2e387]:
          - generic [ref=f2e388]: Enciende el televisor
          - generic [ref=f2e389]: Si está apagado, Mando TV lo enciende por la red y se conecta solo.
        - listitem [ref=f2e390]:
          - generic [ref=f2e391]: A tu gusto
          - generic [ref=f2e392]: Claro u oscuro y vibración gratis. Con Pro, el color de fondo que prefieras, negro puro y control clásico.
        - listitem [ref=f2e393]:
          - generic [ref=f2e394]: Comparte un mando con tu familia
          - generic [ref=f2e395]: Arma un mando sencillo para tu TV y envíalo como enlace, por ejemplo por WhatsApp. Quien lo recibe lo abre en Mando TV y lo guarda; la primera vez, el TV pide permiso para su celular y lo acepta en la pantalla del TV. El enlace no lleva ninguna clave ni contraseña del TV. El mando para invitados es gratis y tiene fecha de vencimiento, de hasta 31 días. Crear el mando fácil, con hasta 6 botones gigantes, es Pro; usarlo es gratis.
        - listitem [ref=f2e396]:
          - generic [ref=f2e397]: Duplica la pantalla
          - generic [ref=f2e398]: Mando TV te guía a Duplicar pantalla del Centro de control para ver tu iPhone o iPad en un TV con AirPlay. En Windows abre Transmitir con Windows + K. Gratis. Y con Pro, Mando TV envía la pantalla del PC a TV LG, Samsung, Hisense o Android TV por la red de la casa (beta, con unos segundos de demora y sin sonido). Pronto en Android.
        - listitem [ref=f2e399]:
          - generic [ref=f2e400]: Sin abrir la app (Pro)
          - generic [ref=f2e401]: Widgets en la pantalla de inicio y en la pantalla bloqueada del iPhone, botones en el Centro de control y frases de Siri y Atajos, como "Silencia el TV con Mando TV". En beta. En Android llega con su versión pública.
      - generic "Partes de la app" [ref=f2e402]:
