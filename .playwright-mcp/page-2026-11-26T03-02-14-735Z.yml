  - generic [ref=f2e438]:
    - region [ref=f2e439]:
      - heading "Listo en un minuto" [level=2] [ref=f2e440]
      - paragraph [ref=f2e441]: No necesitas crear una cuenta ni instalar nada en el televisor.
      - list [ref=f2e442]:
        - listitem [ref=f2e443]:
          - generic [ref=f2e444]: Misma red WiFi
          - paragraph [ref=f2e445]: El teléfono y el televisor tienen que estar en la misma red de tu casa.
        - listitem [ref=f2e446]:
          - generic [ref=f2e447]: Toca tu televisor
          - paragraph [ref=f2e448]: Mando TV lo encuentra solo. Si no aparece, escribes su dirección IP.
        - listitem [ref=f2e449]:
          - generic [ref=f2e450]: Acepta en la pantalla
          - paragraph [ref=f2e451]: La primera vez el televisor pide permiso. Lo aceptas una vez y queda guardado.
    - region [ref=f2e452]:
      - heading "WiFi, infrarrojo y Bluetooth" [level=2] [ref=f2e453]
      - paragraph [ref=f2e454]: "Mando TV se conecta por WiFi. Si tu celular Android tiene emisor infrarrojo, también maneja televisores que no son inteligentes o que nunca se conectaron al WiFi. Desde Android 9 también se conecta por Bluetooth (beta): el celular hace de teclado y control del TV, con WiFi o sin él."
      - list [ref=f2e455]:
        - listitem [ref=f2e456]:
          - generic [ref=f2e462]: Disponible
          - generic [ref=f2e463]: WiFi
          - paragraph [ref=f2e464]: Samsung, LG, Roku, Google TV y Android TV, desde el teléfono o el computador. El teléfono y el TV solo tienen que estar en la misma red.
        - listitem [ref=f2e465]:
          - generic [ref=f2e471]: Nuevo
          - generic [ref=f2e472]: Infrarrojo
          - paragraph [ref=f2e473]: "En celulares Android con emisor infrarrojo, común en Xiaomi, Redmi y POCO. Sirve para televisores antiguos o sin internet y puede encender uno que nunca configuraste: solo apunta el celular al TV. No aparece en iPhone, Windows ni en Android sin emisor."
        - listitem [ref=f2e474]:
          - generic [ref=f2e477]: Beta
          - generic [ref=f2e478]: Bluetooth
          - paragraph [ref=f2e479]: En celulares con Android 9 o más reciente, gratis. El celular se conecta al TV como un teclado y control Bluetooth, así que sirve aunque no haya WiFi. Funciona con Google TV, Android TV y Fire TV; otras marcas que aceptan teclados Bluetooth podrían funcionar. Roku no los acepta. No está en iPhone ni en Windows.
  - generic [ref=f2e480]:
    - region [ref=f2e481]:
      - heading "Pruébalo en Android antes que nadie" [level=2] [ref=f2e482]
      - paragraph [ref=f2e483]: Mando TV para Android está en prueba anticipada en Google Play. Es gratis, son dos pasos y necesitas un teléfono Android con tu cuenta de Google. La prueba ya tiene la versión 1.1, con el widget para la pantalla de inicio (Pro) y el infrarrojo también para decodificadores, barras de sonido, proyectores y aire acondicionado.
      - list [ref=f2e484]:
        - listitem [ref=f2e485]:
          - generic [ref=f2e486]: 1. Únete al grupo
          - paragraph [ref=f2e487]: Entra con la misma cuenta de Google de tu teléfono y toca "Unirse al grupo". Por ahí te avisamos de cada versión nueva.
          - link "Unirme al grupo" [ref=f2e488] [cursor=pointer]:
            - /url: https://groups.google.com/g/mandotv-testers/about
        - listitem [ref=f2e489]:
          - generic [ref=f2e490]: 2. Instálalo desde Google Play
          - paragraph [ref=f2e491]: "Toca \"Convertirse en tester\" y luego descárgalo. Si Google Play dice que aún no está disponible, la app está en revisión: te avisamos por correo apenas esté lista."
          - link "Instalar la prueba" [ref=f2e492] [cursor=pointer]:
            - /url: https://play.google.com/apps/testing/app.mandotv.mando
      - paragraph [ref=f2e493]:
        - text: "Déjala instalada y úsala unos días: así Google la publica para todos. ¿Dudas? Escríbenos a"
        - link "hola@mandotv.app" [ref=f2e494] [cursor=pointer]:
