  - region [ref=f1e369]:
    - heading "Todo lo del control, y más" [level=2] [ref=f1e370]
    - paragraph [ref=f1e371]: "Lo que haces con el control de siempre, más lo que con él cuesta: escribir, abrir apps, cambiar de entrada sin buscar botones y moverte rápido por los menús. Lo marcado con Pro es de pago único."
    - generic [ref=f1e372]:
      - list [ref=f1e373]:
        - listitem [ref=f1e374]:
          - generic [ref=f1e375]: Botones grandes y claros
          - generic [ref=f1e376]: Cruceta, OK, Atrás, Inicio, volumen, canales y silencio, con su nombre siempre visible.
        - listitem [ref=f1e377]:
          - generic [ref=f1e378]: Touchpad (Pro)
          - generic [ref=f1e379]: Desliza el dedo para moverte por los menús, o usa el puntero en los televisores que lo tienen.
        - listitem [ref=f1e380]:
          - generic [ref=f1e381]: Teclado del teléfono
          - generic [ref=f1e382]: Escribe una contraseña del WiFi o busca en apps sin pasar letra por letra. En YouTube, la búsqueda aparece directo en el TV.
        - listitem [ref=f1e383]:
          - generic [ref=f1e384]: Abre tus apps
          - generic [ref=f1e385]: Netflix, YouTube y las demás apps del televisor, con un toque.
        - listitem [ref=f1e386]:
          - generic [ref=f1e387]: Entradas y sonido
          - generic [ref=f1e388]: Cambia a HDMI, TV en vivo o la consola. Con Pro, en LG eliges si suena el TV o la barra de sonido.
        - listitem [ref=f1e389]:
          - generic [ref=f1e390]: Enciende el televisor
          - generic [ref=f1e391]: Si está apagado, Mando TV lo enciende por la red y se conecta solo.
        - listitem [ref=f1e392]:
          - generic [ref=f1e393]: A tu gusto
          - generic [ref=f1e394]: Claro u oscuro y vibración gratis. Con Pro, el color de fondo que prefieras, negro puro y control clásico.
        - listitem [ref=f1e395]:
          - generic [ref=f1e396]: Comparte un mando con tu familia
          - generic [ref=f1e397]: Arma un mando sencillo para tu TV y envíalo como enlace, por ejemplo por WhatsApp. Quien lo recibe lo abre en Mando TV y lo guarda; la primera vez, el TV pide permiso para su celular y lo acepta en la pantalla del TV. El enlace no lleva ninguna clave ni contraseña del TV. El mando para invitados es gratis y tiene fecha de vencimiento, de hasta 31 días. Crear el mando fácil, con hasta 6 botones gigantes, es Pro; usarlo es gratis.
        - listitem [ref=f1e398]:
          - generic [ref=f1e399]: Duplica la pantalla
          - generic [ref=f1e400]: Mando TV te guía a Duplicar pantalla del Centro de control para ver tu iPhone o iPad en un TV con AirPlay. En Windows abre Transmitir con Windows + K. Gratis. Y con Pro, Mando TV envía la pantalla del PC a TV LG, Samsung, Hisense o Android TV por la red de la casa (beta, con unos segundos de demora y sin sonido). Pronto en Android.
        - listitem [ref=f1e401]:
          - generic [ref=f1e402]: Sin abrir la app (Pro)
          - generic [ref=f1e403]: Widgets en la pantalla de inicio y en la pantalla bloqueada del iPhone, botones en el Centro de control y frases de Siri y Atajos, como "Silencia el TV con Mando TV". En beta. En Android llega con su versión pública.
