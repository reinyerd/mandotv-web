          - paragraph [ref=f1e493]: "Toca \"Convertirse en tester\" y luego descárgalo. Si Google Play dice que aún no está disponible, la app está en revisión: te avisamos por correo apenas esté lista."
          - link "Instalar la prueba" [ref=f1e494] [cursor=pointer]:
            - /url: https://play.google.com/apps/testing/app.mandotv.mando
      - paragraph [ref=f1e495]:
