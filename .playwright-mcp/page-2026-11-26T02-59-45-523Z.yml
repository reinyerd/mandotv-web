  - generic [ref=f1e440]:
    - region [ref=f1e441]:
      - heading "Listo en un minuto" [level=2] [ref=f1e442]
      - paragraph [ref=f1e443]: No necesitas crear una cuenta ni instalar nada en el televisor.
      - list [ref=f1e444]:
        - listitem [ref=f1e445]:
          - generic [ref=f1e446]: Misma red WiFi
          - paragraph [ref=f1e447]: El teléfono y el televisor tienen que estar en la misma red de tu casa.
        - listitem [ref=f1e448]:
          - generic [ref=f1e449]: Toca tu televisor
          - paragraph [ref=f1e450]: Mando TV lo encuentra solo. Si no aparece, escribes su dirección IP.
        - listitem [ref=f1e451]:
          - generic [ref=f1e452]: Acepta en la pantalla
          - paragraph [ref=f1e453]: La primera vez el televisor pide permiso. Lo aceptas una vez y queda guardado.
    - region [ref=f1e454]:
      - heading "WiFi, infrarrojo y Bluetooth" [level=2] [ref=f1e455]
      - paragraph [ref=f1e456]: "Mando TV se conecta por WiFi. Si tu celular Android tiene emisor infrarrojo, también maneja televisores que no son inteligentes o que nunca se conectaron al WiFi. Desde Android 9 también se conecta por Bluetooth (beta): el celular hace de teclado y control del TV, con WiFi o sin él."
      - list [ref=f1e457]:
        - listitem [ref=f1e458]:
          - generic [ref=f1e464]: Disponible
          - generic [ref=f1e465]: WiFi
          - paragraph [ref=f1e466]: Samsung, LG, Roku, Google TV y Android TV, desde el teléfono o el computador. El teléfono y el TV solo tienen que estar en la misma red.
        - listitem [ref=f1e467]:
          - generic [ref=f1e473]: Nuevo
          - generic [ref=f1e474]: Infrarrojo
          - paragraph [ref=f1e475]: "En celulares Android con emisor infrarrojo, común en Xiaomi, Redmi y POCO. Sirve para televisores antiguos o sin internet y puede encender uno que nunca configuraste: solo apunta el celular al TV. No aparece en iPhone, Windows ni en Android sin emisor."
        - listitem [ref=f1e476]:
          - generic [ref=f1e479]: Beta
          - generic [ref=f1e480]: Bluetooth
          - paragraph [ref=f1e481]: En celulares con Android 9 o más reciente, gratis. El celular se conecta al TV como un teclado y control Bluetooth, así que sirve aunque no haya WiFi. Funciona con Google TV, Android TV y Fire TV; otras marcas que aceptan teclados Bluetooth podrían funcionar. Roku no los acepta. No está en iPhone ni en Windows.
  - generic [ref=f1e482]:
    - region [ref=f1e483]:
      - heading "Pruébalo en Android antes que nadie" [level=2] [ref=f1e484]
      - paragraph [ref=f1e485]: Mando TV para Android está en prueba anticipada en Google Play. Es gratis, son dos pasos y necesitas un teléfono Android con tu cuenta de Google. La prueba ya tiene la versión 1.1, con el widget para la pantalla de inicio (Pro) y el infrarrojo también para decodificadores, barras de sonido, proyectores y aire acondicionado.
      - list [ref=f1e486]:
        - listitem [ref=f1e487]:
          - generic [ref=f1e488]: 1. Únete al grupo
          - paragraph [ref=f1e489]: Entra con la misma cuenta de Google de tu teléfono y toca "Unirse al grupo". Por ahí te avisamos de cada versión nueva.
          - link "Unirme al grupo" [ref=f1e490] [cursor=pointer]:
            - /url: https://groups.google.com/g/mandotv-testers/about
        - listitem [ref=f1e491]:
