<!doctype html>
<html lang="es" style="--marca: #3d7bff">
<head>
<meta charset="utf-8">
<!-- Genera social.png (1200x630): msedge --headless --screenshot --window-size=1200,630 http://127.0.0.1:8090/herramientas/social.html -->
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..100,600..900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/estilos.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: var(--marca); }
  .tarjeta { position: relative; width: 1200px; height: 630px; }
  .tarjeta .gigante { position: absolute; left: 40px; top: 20px; right: auto; width: auto; margin: 0; transform: none; text-align: left; font-family: var(--titular); font-weight: 900; font-stretch: 62%; font-size: 250px; line-height: .8; color: rgba(255,255,255,.3); }
  .tarjeta .lugar-tel { position: absolute; left: 110px; top: 135px; transform: rotate(-12deg) scale(.9); transform-origin: top left; }
  .tarjeta .lugar-tel .telefono { width: 260px; }
  .tarjeta .texto { position: absolute; left: 520px; top: 150px; width: 640px; color: #0f1115; }
  .tarjeta h1 { font-family: var(--titular); font-weight: 900; font-stretch: 72%; font-size: 96px; line-height: .9; margin: 0 0 26px; letter-spacing: -.02em; }
  .tarjeta p { font-family: var(--texto); font-weight: 600; font-size: 30px; line-height: 1.3; margin: 0; }
  .tarjeta .chips { display: flex; gap: 10px; margin-top: 22px; flex-wrap: wrap; }
  .tarjeta .chips span { background: #0f1115; color: #fff; border-radius: 999px; padding: 10px 18px; font: 700 22px var(--texto); }
  .tarjeta .url { position: absolute; right: 70px; bottom: 50px; background: #0f1115; color: #fff; border-radius: 999px; padding: 18px 30px; font: 700 30px var(--texto); }
</style>
</head>
<body>
<div class="tarjeta">
  <p class="gigante" aria-hidden="true">MANDO</p>
  <div class="lugar-tel"><div class="telefono" data-ui id="telefono" role="img" aria-label="La app Mando TV abierta en un teléfono, con la cruceta, el botón OK y los botones de volumen y canal.">
              <div class="pantalla" aria-hidden="true">
                <div class="isla"></div>
                <div class="app">
                  <div class="app-cabecera">
                    <div>
                      <div class="app-tv" id="app-tv">TV Samsung</div>
                      <div class="app-estado">Conectado</div>
                    </div>
                    <div class="encender"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M12 3v8"/><path d="M6.3 7a8 8 0 1 0 11.4 0"/></svg></div>
                  </div>
                  <div class="fila-teclas">
                    <div class="tecla vidrio">Entradas</div>
                    <div class="tecla vidrio">Inicio / Menú</div>
                    <div class="tecla vidrio">Atrás</div>
                  </div>
                  <div class="cruceta vidrio">
                    <span class="flecha arriba"></span><span class="flecha abajo"></span>
                    <span class="flecha izq"></span><span class="flecha der"></span>
                    <div class="ok">OK</div>
                  </div>
                  <div class="balancines">
                    <div class="balancin vidrio"><b>+</b><small>VOL</small><b>−</b></div>
                    <div class="balancin vidrio"><b>+</b><small>CH</small><b>−</b></div>
                  </div>
                  <div class="pestanas vidrio">
                    <span class="activa">Control</span><span>Touchpad</span><span>Teclado</span><span>Apps</span>
                  </div>
                </div>
              </div>
            </div></div>
  <div class="texto">
    <h1>Un control para todos tus TV</h1>
    <p>Gratis, sin anuncios y sin cuentas.</p>
    <div class="chips"><span>Samsung</span><span>LG</span><span>Roku</span><span>Google TV</span><span>Android TV</span></div>
  </div>
  <div class="url">mandotv.app</div>
</div>
</body>
</html>
